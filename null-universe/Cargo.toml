[package]
name = "null-universe"
version = "0.1.0"
edition = "2021"
authors = ["Null Universe Contributors"]
description = "Headless deterministic simulation engine for the Null Universe on Bevy and Rapier inside OpenSandbox"

[dependencies]
# Headless Bevy without windowing or default rendering
bevy = { version = "0.15", default-features = false }

# 3D Rapier physics with determinism and serialization
bevy_rapier3d = { version = "0.28", features = ["enhanced-determinism", "serde-serialize"] }

# Async runtime and networking for IPC socket communications
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Data serialization for agent perception and actions
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Command-line configuration
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
